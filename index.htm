<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Шаблони — Менеджер</title>
<style>
/* ... стили как в предыдущей версии ... */

/* Hotkeys HUD */
#hotkeysHUD{
  position:fixed;
  right:18px;
  top:18px;
  background:rgba(0,0,0,0.72);
  color:#fff;
  padding:8px 10px;
  border-radius:8px;
  font-size:13px;
  z-index:12000;
  opacity:0;
  transform:translateY(-6px);
  transition:opacity .18s ease,transform .18s ease;
  pointer-events:none;
}
#hotkeysHUD.show{ opacity:1; transform:translateY(0); }
#hotkeysHUD .keys{ font-weight:700; letter-spacing:0.6px; }
</style>
</head>
<body>
<div class="app">
  <!-- ... sidebar и topbar ... -->
  <main class="main" id="mainArea">
    <div class="topbar">
      <!-- ... -->
      <button id="btnHotkeys" class="btn" title="Гарячі клавіші 1–0">Hotkeys</button>
    </div>
    <div style="padding:12px;overflow:auto;height:calc(100% - 64px)">
      <div id="grid" class="grid"></div>
    </div>
  </main>
</div>

<!-- Hotkeys HUD -->
<div id="hotkeysHUD" aria-hidden="true"><span class="keys">1–0</span> — копіювати видимі шаблони</div>

<!-- ... модальные окна ... -->

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>
(function(){
  const STORAGE_KEY = 'brainTemplates';
  const CATEGORY_ORDER_KEY = 'categoryOrder';
  const BG_KEY = 'mainBackground';
  const THEME_KEY = 'themePreference';
  const UI_TILE_KEY = 'uiTileWidth';

  const $ = id => document.getElementById(id);

  // ... остальные функции ...

  // copyAndCount с параметром silent
  function copyAndCount(id, silent=false){
    const t = templates.find(x=>x.id===id);
    if(!t) return;
    const textToCopy = t.text || '';
    navigator.clipboard.writeText(textToCopy).then(()=>{
      t.usage = (t.usage||0)+1;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(templates));
      const tileEl = document.querySelector(`.tile[data-id="${id}"]`);
      if(tileEl){ tileEl.classList.add('just-copied'); setTimeout(()=>tileEl.classList.remove('just-copied'),420); }
      if(!silent) toast(`Скопійовано: «${t.title}»`);
    }).catch(err=>console.error(err));
  }

  // Экспорт JSON — берём все шаблоны из localStorage
  safeOn($('btnExport'), 'click', ()=>{
    const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const data = JSON.stringify(all,null,2);
    const blob = new Blob([data],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url;
    a.download='templates.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });

  // Hotkeys module
  (function hotkeysModule(){
    let hotkeysEnabled = false;
    const btnHotkeys = $('btnHotkeys');
    const hotkeysHUD = $('hotkeysHUD');
    const HOTKEYS_KEY = 'templatesHotkeysEnabled';

    function showHotkeysHUD(msg = null, ms = 1200){
      if(!hotkeysHUD) return;
      hotkeysHUD.innerHTML = (msg || '<span class="keys">1–0</span> — копіювати видимі шаблони');
      hotkeysHUD.classList.add('show');
      setTimeout(()=> hotkeysHUD.classList.remove('show'), ms);
    }

    function hotkeysHandler(e){
      const active = document.activeElement;
      if(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable)) return;
      if(!/^[0-9]$/.test(e.key)) return;
      let idx = (e.key==='0') ? 9 : (parseInt(e.key,10)-1);
      const list = filtered();
      if(!list || !list.length){ showHotkeysHUD('Немає видимих шаблонів'); return; }
      if(idx<0 || idx>=list.length){ showHotkeysHUD('Індекс поза діапазоном'); return; }
      copyAndCount(list[idx].id,true); // silent=true
      showHotkeysHUD(`Скопійовано: «${list[idx].title||'Без назви'}»`,900);
    }

    function enableHotkeys(){
      if(hotkeysEnabled) return;
      document.addEventListener('keydown', hotkeysHandler);
      hotkeysEnabled = true;
      btnHotkeys.classList.add('active');
      showHotkeysHUD('Hotkeys увімкнено');
      localStorage.setItem(HOTKEYS_KEY,'true');
    }
    function disableHotkeys(){
      if(!hotkeysEnabled) return;
      document.removeEventListener('keydown', hotkeysHandler);
      hotkeysEnabled = false;
      btnHotkeys.classList.remove('active');
      showHotkeysHUD('Hotkeys вимкнено');
      localStorage.setItem(HOTKEYS_KEY,'false');
    }
    function toggleHotkeys(){ hotkeysEnabled?disableHotkeys():enableHotkeys(); }

    btnHotkeys.addEventListener('click',toggleHotkeys);
    if(localStorage.getItem(HOTKEYS_KEY)==='true') enableHotkeys();
  })();

  // ... init, renderTemplates, etc ...
})();
</script>
</body>
</html>
